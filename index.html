<!doctype html>
<html lang="en" data-skin="windows" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mark Plowright · IT support, networking and systems</title>
    <meta
      name="description"
      content="Mark Plowright's portfolio, shaped like a desktop OS in the browser. Field Systems Engineer in New York City. Projects, home labs, presentations and resume."
    />
    <!-- Phone only (narrower than 768px): the status bar strip matches the top of the
         phone wallpaper. The first tag that matches wins, so the desktop keeps #2e2f33. -->
    <meta name="theme-color" media="(max-width: 767px) and (prefers-color-scheme: dark)" content="#0f1a4a" />
    <meta name="theme-color" media="(max-width: 767px)" content="#5a3fb8" />
    <meta name="theme-color" content="#2e2f33" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="/brand/logo-mark.webp" />

    <!-- Saved to an iPhone home screen: opens as an app with this name. iOS keeps its
         own status bar above the site (not full-bleed), which avoids the iOS bug
         where the page shifts after returning from a link. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Plowright" />
    <link rel="canonical" href="https://markplowwright.github.io/" />

    <!-- Link previews (LinkedIn, Slack, iMessage...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mark Leslie Plowright OS" />
    <meta property="og:title" content="Mark Plowright · IT support, networking and systems" />
    <meta property="og:description" content="A portfolio you can click around like a desktop or a phone: projects, home labs, presentations and resume." />
    <meta property="og:image:alt" content="Mark Plowright, OS and mobile portfolio: a monitor and a phone around the letters MP" />
    <meta property="og:url" content="https://markplowwright.github.io/" />
    <meta property="og:image" content="https://markplowwright.github.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="color: #fff; padding: 20px; font-family: system-ui">
        This portfolio needs JavaScript. You can still read Mark's resume:
        <a href="/resume.pdf" style="color: #9cd0ff">resume.pdf</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
